name: Infra Deployment Pipeline

on:
  push:
    paths:
      - 'infra/storage/**'
      - 'infra/security/**'
      - 'infra/network/**'
      - '.github/workflows/deploy-infra.yaml'
    branches:
      - dev
      - prod
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infra:
    runs-on: ubuntu-latest

    env:
      DEV_REGION: us-east-2
      PROD_REGION: us-east-1
      DEV_EXECUTION_ROLE_ARN: ${{ secrets.DEV_EXECUTION_ROLE_ARN}}
      PROD_EXECUTION_ROLE_ARN: ${{ secrets.PROD_EXECUTION_ROLE_ARN}}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set environment
        run: |
          if [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
            echo "ENV=dev" >> $GITHUB_ENV
            echo "AWS_REGION=${DEV_REGION}" >> $GITHUB_ENV
          else
            echo "ENV=prod" >> $GITHUB_ENV
            echo "AWS_REGION=${PROD_REGION}" >> $GITHUB_ENV
          fi

      - name: Configure AWS credentials for dev
        if: github.ref == 'refs/heads/dev'
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ github.ref == 'refs/heads/dev' && secrets.DEV_INFRA_DEPLOY_ROLE_ARN || secrets.PROD_INFRA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set stack order
        run: |
          echo "STACKS=storage network security" >> $GITHUB_ENV

      - name: Validate and deploy stacks
        run: |
          set -e

          for STACK in $STACKS; do
            echo "=================================================================="
            echo "============= Processing stack: ${ENV}-${STACK}-stack =============="
            echo "=================================================================="

            TEMPLATE_FILE="infra/${STACK}/${STACK}-stack.yaml"
            PARAMS_FILE="infra/${STACK}/${ENV}.json"
            
            echo "-> Running yamllint..."
            yamllint $TEMPLATE_FILE

            echo "-> Running cfn-lint..."
            cfn-lint $TEMPLATE_FILE

            echo "-> Validating CloudFormation template..."
            aws cloudformation validate-template --template-body file://$TEMPLATE_FILE

            STACK_NAME="${ENV}-${STACK}-stack"

            echo "ENV=$ENV"
            echo "GITHUB_REF_NAME=$GITHUB_REF_NAME"
            echp "GITHUB_REF=$GITHUB_REF"

            if [[ "$ENV" == "dev" ]]; then
              ROLE_ARN="${DEV_EXECUTION_ROLE_ARN}"
            else
              ROLE_ARN="${PROD_EXECUTION_ROLE_ARN}"
            fi

            echo "ROLE_ARN=${ROLE_ARN##*/}"

            aws cloudformation deploy \
              --stack-name "${STACK_NAME}" \
              --template-file "${TEMPLATE_FILE}" \
              --parameter-overrides file://"${PARAMS_FILE}" \
              --capabilities CAPABILITY_NAMED_IAM \
              --role-arn "${ROLE_ARN}"
              --region "${AWS_REGION}" \
              --debug
          done