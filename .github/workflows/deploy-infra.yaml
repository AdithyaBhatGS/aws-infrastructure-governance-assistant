name: Infra Pipeline Static Web Hosting

on:
  push:
    paths:
      - 'infra/**'
    branches:
      - dev
      - main

jobs:
  deploy-infra:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ github.ref == 'refs/heads/dev' && 'us-east-2' || github.ref == 'refs/heads/main' && 'us-east-1' }}


    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set stack order
        id: stacks
        run: echo "STACKS=storage security network application" >> $GITHUB_ENV

      - name: Validate and deploy stacks
        run: |
          for STACK in $STACKS; do
            echo "==== Processing stack: $STACK-stack ===="

            TEMPLATE_FILE="infra/$STACK/$STACK-stack.yaml"
            PARAMS_FILE="infra/$STACK/${{ github.ref == 'refs/heads/dev' && 'dev.json' || 'prod.json' }}"

            echo "-> Running yamllint..."
            yamllint $TEMPLATE_FILE

            echo "-> Running cfn-lint..."
            cfn-lint $TEMPLATE_FILE

            echo "-> Validating CloudFormation template..."
            aws cloudformation validate-template --template-body file://$TEMPLATE_FILE

            echo "-> Deploying stack..."
            aws cloudformation deploy \
              --template-file $TEMPLATE_FILE \
              --stack-name $STACK-stack \
              --parameter-overrides file://$PARAMS_FILE \
              --capabilities CAPABILITY_NAMED_IAM \
              --region $AWS_REGION

            echo "==== Deployment of $STACK-stack complete ===="

            if [[ "$STACK" == *"storage"* ]]; then
              BUCKET_NAME=$(aws cloudformation describe-stacks \
                --stack-name $STACK \
                --query "Stacks[0].Outputs[?OutputKey=='OutputBktName'].OutputValue" \
                --output text \
                --region $AWS_REGION)

              aws ssm put-parameter \
                --name "/app/bucket_name" \
                --value "$BUCKET_NAME" \
                --type String \
                --overwrite \
                --region $AWS_REGION
                echo "Stored $BUCKET_NAME in SSM"

            elif [[ "$STACK" == *"application"* ]]; then
              ALB_DNS=$(aws cloudformation describe-stacks \
                --stack-name $STACK \
                --query "Stacks[0].Outputs[?OutputKey=='ALBPublicDNS'].OutputValue" \
                --output text \
                --region $AWS_REGION)

              # Store ALB DNS in SSM
              aws ssm put-parameter \
                --name "/app/alb_dns" \
                --value "$ALB_DNS" \
                --type String \
                --overwrite \
                --region $AWS_REGION
              echo "Stored $ALB_DNS in SSM"

            else
              echo "No SSM parameters for $STACK-stack!!!"
            fi
          done

      - name: Verify stack statuses
        run: |
          for STACK in $STACKS; do
            STATUS=$(aws cloudformation describe-stacks \
              --stack-name $STACK-stack \
              --region ${{ env.AWS_REGION }} \
              --query "Stacks[0].StackStatus" \
              --output text)
            echo "$STACK-stack status: $STATUS"
            if [[ "$STATUS" != "CREATE_COMPLETE" && "$STATUS" != "UPDATE_COMPLETE" ]]; then
              echo "Error: $STACK-stack stack deployment failed"
              exit 1
            fi
          done
