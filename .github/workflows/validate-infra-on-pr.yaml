name: Infra Validation

on:
  pull_request:
    paths:
      - 'infra/**'
    branches:
      - dev
      - prod

jobs:
  validate-infra:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ${{ github.base_ref == 'dev' && 'us-east-2' || github.base_ref == 'prod' && 'us-east-1' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials for dev
        if: github.base_ref == 'dev'
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dev-infra-pipeline-static-web-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials for prod
        if: github.base_ref == 'prod'
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/prod-infra-pipeline-static-web-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Set ENV based on branch
        run: |
          if [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
            echo "ENV=dev" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF_NAME}" == "prod" ]]; then
            echo "ENV=prod" >> $GITHUB_ENV
          else
            echo "ENV=unknown" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set stack order
        id: stacks
        run: echo "STACKS=storage security network application" >> $GITHUB_ENV

      - name: Validate and deploy stacks
        run: |
          for STACK in $STACKS; do
            echo "==== Processing stack: $ENV-$STACK-stack ===="

            TEMPLATE_FILE="infra/$STACK/$STACK-stack.yaml"
            PARAMS_FILE="infra/$STACK/${{ github.ref == 'refs/heads/dev' && 'dev.json' || 'prod.json' }}"

            echo "-> Running yamllint..."
            yamllint $TEMPLATE_FILE

            echo "-> Running cfn-lint..."
            cfn-lint $TEMPLATE_FILE

            echo "-> Validating CloudFormation template..."
            aws cloudformation validate-template --template-body file://$TEMPLATE_FILE
          done