name: IAC Validation Pipeline

on:
  pull_request:
    branches:
      - dev
      - prod

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      application: ${{ steps.filter.outputs.application }}
      lt: ${{ steps.filter.outputs.lt }}
      network: ${{ steps.filter.outputs.network }}
      security: ${{ steps.filter.outputs.security }}
      storage: ${{ steps.filter.outputs.storage }}
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
    steps:
      - name: Checkout Code
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            application:
              - 'infra/application/**'
            lt:
              - 'infra/launch-template/**'
            network:
              - 'infra/network/**'
            security:
              - 'infra/security/**'
            storage:
              - 'infra/storage/**'
            infrastructure:
              - 'infra/application/**'
              - 'infra/launch-template/**'
              - 'infra/network/**'
              - 'infra/security/**'
              - 'infra/storage/**'

  validate-application-infra:
    needs: changes
    if: ${{ needs.changes.outputs.application == 'true' }}
    runs-on: ubuntu-latest

    permissions: 
      id-token: write
      contents: read

    env:
      AWS_REGION: ${{ github.base_ref == 'dev' && 'us-east-2' || github.base_ref == 'prod' && 'us-east-1' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Debug GitHub context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Event: ${{ github.event_name }}"
          echo "Base branch: ${{ github.base_ref }}"
          echo "Head branch: ${{ github.head_ref }}"
          echo "AWS region: ${{ env.AWS_REGION }}"
          echo "Validation role configured: ${{ secrets.VALIDATION_ROLE_ARN != '' }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.VALIDATION_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-${{ github.run_id }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set stack
        id: stacks
        run: echo "STACK=application" >> $GITHUB_ENV

      - name: Validate and deploy ${STACK}-stack
        run: |
          set -e

          echo "==== Processing stack: $STACK-stack ===="

          TEMPLATE_FILE="infra/$STACK/$STACK-stack.yaml"

          echo "-> Running yamllint..."
          yamllint $TEMPLATE_FILE

          echo "-> Running cfn-lint..."
          cfn-lint $TEMPLATE_FILE

          echo "-> Running cloudformation validate..."
          aws cloudformation validate-template \
              --template-body file://$TEMPLATE_FILE

  validate-lt:
    needs: changes
    if: ${{ needs.changes.outputs.lt == 'true' }}
    runs-on: ubuntu-latest

    permissions: 
      id-token: write
      contents: read

    env:
      AWS_REGION: ${{ github.base_ref == 'dev' && 'us-east-2' || github.base_ref == 'prod' && 'us-east-1' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.VALIDATION_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set stack
        id: stacks
        run: echo "STACK=launch-template" >> $GITHUB_ENV

      - name: Validate and deploy ${STACK}-stack
        run: |
          set -e

          echo "==== Processing stack: $STACK-stack ===="

          TEMPLATE_FILE="infra/$STACK/$STACK-stack.yaml"

          echo "-> Running yamllint..."
          yamllint $TEMPLATE_FILE

          echo "-> Running cfn-lint..."
          cfn-lint $TEMPLATE_FILE

          echo "-> Running cloudformation validate..."
          aws cloudformation validate-template \
              --template-body file://$TEMPLATE_FILE

  validate-network-infra:
    needs: changes
    if: ${{ needs.changes.outputs.network == 'true' }}
    runs-on: ubuntu-latest

    permissions: 
      id-token: write
      contents: read

    env:
      AWS_REGION: ${{ github.base_ref == 'dev' && 'us-east-2' || github.base_ref == 'prod' && 'us-east-1' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.VALIDATION_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set stack
        id: stacks
        run: echo "STACK=network" >> $GITHUB_ENV

      - name: Validate and deploy ${STACK}-stack
        run: |
          set -e

          echo "==== Processing stack: $STACK-stack ===="

          TEMPLATE_FILE="infra/$STACK/$STACK-stack.yaml"

          echo "-> Running yamllint..."
          yamllint $TEMPLATE_FILE

          echo "-> Running cfn-lint..."
          cfn-lint $TEMPLATE_FILE

          echo "-> Running cloudformation validate..."
          aws cloudformation validate-template \
              --template-body file://$TEMPLATE_FILE
  
  validate-security-infra:
    needs: changes
    if: ${{ needs.changes.outputs.security == 'true' }}
    runs-on: ubuntu-latest

    permissions: 
      id-token: write
      contents: read

    env:
      AWS_REGION: ${{ github.base_ref == 'dev' && 'us-east-2' || github.base_ref == 'prod' && 'us-east-1' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.VALIDATION_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set stack
        id: stacks
        run: echo "STACK=security" >> $GITHUB_ENV

      - name: Validate and deploy ${STACK}-stack
        run: |
          set -e

          echo "==== Processing stack: $STACK-stack ===="

          TEMPLATE_FILE="infra/$STACK/$STACK-stack.yaml"

          echo "-> Running yamllint..."
          yamllint $TEMPLATE_FILE

          echo "-> Running cfn-lint..."
          cfn-lint $TEMPLATE_FILE

          echo "-> Running cloudformation validate..."
          aws cloudformation validate-template \
              --template-body file://$TEMPLATE_FILE
  
  validate-storage-infra:
    needs: changes
    if: ${{ needs.changes.outputs.storage == 'true' }}
    runs-on: ubuntu-latest

    permissions: 
      id-token: write
      contents: read

    env:
      AWS_REGION: ${{ github.base_ref == 'dev' && 'us-east-2' || github.base_ref == 'prod' && 'us-east-1' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.VALIDATION_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set stack
        id: stacks
        run: echo "STACK=storage" >> $GITHUB_ENV

      - name: Validate and deploy ${STACK}-stack
        run: |
          set -e

          echo "==== Processing stack: $STACK-stack ===="

          TEMPLATE_FILE="infra/$STACK/$STACK-stack.yaml"

          echo "-> Running yamllint..."
          yamllint $TEMPLATE_FILE

          echo "-> Running cfn-lint..."
          cfn-lint $TEMPLATE_FILE

          echo "-> Running cloudformation validate..."
          aws cloudformation validate-template \
              --template-body file://$TEMPLATE_FILE

  checkov-scan:
    needs: changes
    if: ${{ needs.changes.outputs.infrastructure == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Checkov Scan
        run: |
          checkov \
            -d ./infra \
            --framework cloudformation \
            --external-checks-dir ./security/checkov/organization_policies \
            --skip-path ./infra/bootstrap \
            -o cli \
            -o json \
            --output-file-path checkov-report.json

      - name: Debug workspace
        if: always()
        run: |
          pwd
          ls -R

      - name: Upload Checkov Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: ./checkov-report.json