---
AWSTemplateFormatVersion: "2010-09-09"
Description: Stack to deploy application infra resources. Includes ALB, ASG , Scaling policies, Listener, Target Group

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - prod
    ConstraintDescription: Choose either dev or prod
  ProjectName:
    Type: String
    Description: Represents the project name
  Owner:
    Type: String
    Description: Represents the owner of the project
  ManagedBy:
    Type: String
    Description: Represents the IAC used
  AutoScalingGroupName:
    Type: String
    Description: Represents the name of the Auto Scaling Group
  LoadBalancerName:
    Type: String
    Description: Represents the name of the Application Load Balancer
  ALBTargetGrpName:
    Type: String
    Description: Represents the name of the Target Group
  ALBRequestCountTargetValue:
    Type: Number
    Description: Represents the Average ALB Request Count per Instance
  CPUPolicyTargetValue:
    Type: Number
    Description: The target utilization for the CPU metric
  LaunchTemplateVersion:
    Type: Number
    Description: Launch Template version to be used by the Auto Scaling Group
Resources:
  AppALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      IpAddressType: ipv4
      Name: !Ref LoadBalancerName
      Scheme: internet-facing
      SecurityGroups:
        - Fn::ImportValue:
            Fn::Sub: "${Environment}-network-alb-sg-id"
      Type: application
      Subnets:
        - Fn::ImportValue:
            Fn::Sub: "${Environment}-network-pub-subnet-id1"
        - Fn::ImportValue:
            Fn::Sub: "${Environment}-network-pub-subnet-id2"
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: true
        - Key: access_logs.s3.enabled
          Value: true
        - Key: access_logs.s3.bucket
          Value:
            Fn::ImportValue: !Sub "${Environment}-central-logging-bucket"
        - Key: access_logs.s3.prefix
          Value: alb-access-logs
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-load-balancer"
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: !Ref ManagedBy
  AppALBTargetGrp:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckEnabled: true
      HealthCheckPath: /_stcore/health
      HealthCheckIntervalSeconds: 30
      TargetType: instance
      IpAddressType: ipv4
      Protocol: HTTP
      HealthCheckProtocol: HTTP
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Name: !Ref ALBTargetGrpName
      VpcId:
        Fn::ImportValue:
          Fn::Sub: "${Environment}-network-vpc-id"
      Port: 8501
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-target-grp"
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: !Ref ManagedBy
  AppALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_2
            comment: "Ensure ALB protocol is HTTPS(temporary skip)"
          - id: CKV_AWS_103
            comment: "Ensure that Load Balancer Listener is using at least TLS v1.2(temporary skip)"
    Properties:
      LoadBalancerArn: !GetAtt AppALB.LoadBalancerArn
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !GetAtt AppALBTargetGrp.TargetGroupArn
  AppAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    CreationPolicy: 
      ResourceSignal:
        Count: 2
        Timeout: PT10M
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        WaitOnResourceSignals: true
        PauseTime: PT10M
        SuspendProcesses:
          - HealthCheck
          - ReplaceUnhealthy
    Properties:
      MinSize: 2
      MaxSize: 4
      DesiredCapacity: 2
      AutoScalingGroupName: !Ref AutoScalingGroupName
      LaunchTemplate: 
        LaunchTemplateId:
          Fn::ImportValue:
            Fn::Sub: "${Environment}-launch-temp-id"
        Version: !Ref LaunchTemplateVersion
      TargetGroupARNs:
        - !GetAtt AppALBTargetGrp.TargetGroupArn
      VPCZoneIdentifier:
        - Fn::ImportValue:
            Fn::Sub: "${Environment}-network-priv-subnet-id1"
        - Fn::ImportValue:
            Fn::Sub: "${Environment}-network-priv-subnet-id2"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-asg"
          PropagateAtLaunch: false
        - Key: Environment
          Value: !Ref Environment
          PropagateAtLaunch: true
        - Key: Project
          Value: !Ref ProjectName
          PropagateAtLaunch: true
        - Key: Owner
          Value: !Ref Owner
          PropagateAtLaunch: true
        - Key: ManagedBy
          Value: !Ref ManagedBy
          PropagateAtLaunch: true
  ALBReqCountPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    DependsOn: AppALBListener
    Properties:
      AutoScalingGroupName: !Ref AppAutoScalingGroup
      PolicyType: TargetTrackingScaling
      EstimatedInstanceWarmup: 120
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Join
            - '/'
            - - !GetAtt AppALB.LoadBalancerFullName
              - !GetAtt AppALBTargetGrp.TargetGroupFullName
        TargetValue: !Ref ALBRequestCountTargetValue
  ALBCPUUtilizationPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AppAutoScalingGroup
      PolicyType: TargetTrackingScaling
      EstimatedInstanceWarmup: 120
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: !Ref CPUPolicyTargetValue
  AutoScalingGroupParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/portfolio/${Environment}/asg-name"
      Type: String
      Value: !Ref AppAutoScalingGroup
      Description: Auto Scaling Group used for application deployment
      Tags:
        Environment: !Ref Environment
        Project: !Ref ProjectName
        ManagedBy: !Ref ManagedBy
        Owner: !Ref Owner
Outputs:
  ASGARN:
    Value: !GetAtt AppAutoScalingGroup.AutoScalingGroupARN
    Description: Represents the ARN of the ASG
  ALBARN:
    Value: !GetAtt AppALB.LoadBalancerArn
    Description: Represents the ARN of the load balancer
  ALBTargetGrpARN:
    Value: !GetAtt AppALBTargetGrp.TargetGroupArn
    Description: |
      Represents the ARN of the target group associated with
      the load balancer
  ALBPublicDNS:
    Value: !GetAtt AppALB.DNSName
    Description: Represents the Public DNS of the Elastic Load Balancing
  ASGSSM:
    Value: !Ref AutoScalingGroupParameter
    Description: Represents the name of the SSM Parameter for Auto Scaling Group