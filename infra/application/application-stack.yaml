---
AWSTemplateFormatVersion: "2010-09-09"
Description: An alb stack for deploying the ALB

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - prod
    ConstraintDescription: Choose either dev or prod
  ProjectName:
    Type: String
    Description: Represents the project name
    Default: static-web-hosting
  Owner:
    Type: String
    Description: Represents the owner of the project
    Default: devOps
  ManagedBy:
    Type: String
    Description: Represents the IAC used
    Default: CloudFormation
  AppVersion:
    Type: String
    Description: Represents the version of the app used by launch template
  AutoScalingGroupName:
    Type: String
    Description: Represents the name of the Auto Scaling Group
    AllowedPattern: ^[A-Za-z0-9](?:[A-Za-z0-9-]{0,30}[A-Za-z0-9])?$
    MinLength: 32
  AvailabilityZoneA:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Choose an availablity zone A in the specified region
  AvailabilityZoneB:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Choose an availablity zone B in the specified region
  AMIID:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Description: Represents the AMI ID
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  LoadBalancerName:
    Type: String
    AllowedPattern: ^(?!internal-)[A-Za-z0-9](?:[A-Za-z0-9-]{0,30}[A-Za-z0-9])?$
    Description: Represents the name of the Application Load Balancer
    MaxLength: 32
  ALBTargetGrpName:
    Type: String
    Description: Represents the name of the Target Group
    AllowedPattern: ^[A-Za-z0-9](?:[A-Za-z0-9-]{0,30}[A-Za-z0-9])?$
    MaxLength: 32
  ALBRequestCountTargetValue:
    Type: String
    Description: Represents the Average ALB Request Count per Instance
  CPUPolicyTargetValue:
    Type: String
    Description: The target utilization for the CPU metric
Mappings:
  EnvironmentToInstanceType:
    dev:
      InstanceType: t3.micro
    prod:
      InstanceType: t3.small
Resources:
  AppLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Metadata:
      AWS::CloudFormation::Init:
        config:
          packages:
            yum:
              amazon-cloudwatch-agent: []
              httpd: []
              aws_cli: []
          files:
            /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json:
              content:
                {
                  "logs": {
                    "logs_collected": {
                      "files": {
                        "collect_list": [
                          {
                            "file_path": "/var/log/cloud-init.log",
                            "log_group_name": "infrastructure/ec2/cloud-init",
                            "log_stream_name": "static-web-hosting"
                          },
                          {
                            "file_path": "/var/log/cloud-init-output.log",
                            "log_group_name": "infrastructure/ec2/cloud-init",
                            "log_stream_name": "static-web-hosting-output"
                          },
                          {
                            "file_path": "/var/log/messages",
                            "log_group_name": "infrastructure/ec2/system",
                            "log_stream_name": "static-web-hosting"
                          }
                        ]
                      }
                    }
                  }
                }
              mode: "000644"
              owner: "root"
              group: "root"

            /var/www/html/version.txt:
              content: !Ref AppVersion
          commands:
            01_cloudwatch_agent_setup:
              command: >
                /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl
                -a fetch-config
                -m ec2
                -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
                -s
            02_deploy_app:
              command:
                Fn::Sub:
                  - |
                    aws s3 sync s3://${ARTIFACT_BKT_NAME}/app/${AppVersion}/ /var/www/html
                  - ARTIFACT_BKT_NAME :
                      Fn::ImportValue: "${Environment}-storage-artifact-bkt"
          services:
            sysvinit:
              httpd:
                ensureRunning: "true"
                enabled: "true"
    Properties:
      LaunchTemplateData:
        IamInstanceProfile:
          Name: 
            Fn::ImportValue:
              Fn::Sub: "${Environment}-security-instance-profile"
        ImageId: !Ref AMIID
        InstanceType: !FindInMap
          - EnvironmentToInstanceType
          - !Ref Environment
          - InstanceType
        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: "${Environment}-network-app-sg-id"
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              DeleteOnTermination: true
              VolumeSize: 8
        UserData:
          Fn::Base64: !Sub
            #!/bin/bash -xe

            yum update -y aws-cfn-bootstrap

            /opt/aws/bin/cfn-init -v --stack ${AWS::StackName} --resource AppTemplate --region ${AWS::Region}

            /opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource AutoScalingGroup --region ${AWS::Region}
  AppALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      IpAddressType: ipv4
      Name: !Ref LoadBalancerName
      Scheme: internet-facing
      SecurityGroups:
        - Fn::ImportValue:
            Fn::Sub: "${Environment}-network-alb-sg-id"
      Type: application
      Subnets:
        - Fn::ImportValue:
            Fn::Sub: "${Environment}-network-pub-subnet-id1"
        - Fn::ImportValue:
            Fn::Sub: "${Environment}-network-pub-subnet-id2"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-load-balancer"
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: !Ref ManagedBy
  AppALBTargetGrp:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckEnabled: true
      HealthCheckPath: /index.html
      HealthCheckIntervalSeconds: 30
      TargetType: instance
      IpAddressType: ipv4
      Protocol: HTTP
      HealthCheckProtocol: HTTP
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Name: !Ref ALBTargetGrpName
      VpcId:
        Fn::ImportValue:
          Fn::Sub: "${Environment}-network-vpc-id"
      Port: 80
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-target-grp"
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: !Ref ManagedBy
  AppALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !GetAtt ALBFrontFacing.LoadBalancerArn
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !GetAtt ALBTargetGrp.TargetGroupArn
  AppAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    CreationPolicy: 
      ResourceSignal:
        Count: 2
        Timeout: PT10M
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        WaitOnResourceSignals: true
        PauseTime: PT5M
        SuspendProcesses:
          - HealthCheck
          - ReplaceUnhealthy
    Properties:
      MinSize: 2
      MaxSize: 4
      DesiredCapacity: 2
      AutoScalingGroupName: !Ref AutoScalingGroupName
      AvailabilityZoneDistribution:
        CapacityDistributionStrategy: balanced-best-effort
      AvailabilityZones:
        - !Ref AvailabilityZoneA
        - !Ref AvailabilityZoneB
      LaunchTemplate: 
        LaunchTemplateId: !GetAtt AppTemplate.LaunchTemplateId
        Version: !GetAtt AppTemplate.LatestVersionNumber
      TargetGroupARNs:
        - !GetAtt ALBTargetGrp.TargetGroupArn
      VPCZoneIdentifier:
        - Fn::ImportValue:
            Fn::Sub: "${Environment}-network-priv-subnet-id1"
        - Fn::ImportValue:
            Fn::Sub: "${Environment}-network-priv-subnet-id2"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-asg"
          PropagateAtLaunch: false
        - Key: Environment
          Value: !Ref Environment
          PropagateAtLaunch: true
        - Key: Project
          Value: !Ref ProjectName
          PropagateAtLaunch: true
        - Key: Owner
          Value: !Ref Owner
          PropagateAtLaunch: true
        - Key: ManagedBy
          Value: !Ref ManagedBy
          PropagateAtLaunch: true
  ALBReqCountPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    DependsOn: AppALBListener
    Properties:
      AutoScalingGroupName: !Ref AppAutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Join
            - "/"
            - - !GetAtt AppALB.LoadBalancerFullName
            - - !GetAtt AppALBTargetGrp.TargetGroupFullName
        TargetValue: !Ref ALBRequestCountTargetValue
  ALBCPUUtilizationPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AppAutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: !Ref CPUPolicyTargetValue
Outputs:
  ASGARN:
    Value: !GetAtt AutoScalingGroup.AutoScalingGroupARN
    Description: Represents the ARN of the ASG
  LaunchTempID:
    Value: !GetAtt AppTemplate.LaunchTemplateId
    Description: Represents the ID of the launch template
  AMI:
    Value: !Ref AMIID
    Description: Represents the AMI ID of the app instance
  ALBARN:
    Value: !GetAtt ALBFrontFacing.LoadBalancerArn
    Description: Represents the ARN of the load balancer
  ALBTargetGrpARN:
    Value: !GetAtt ALBTargetGrp.TargetGroupArn
    Description: |
      Represents the ARN of the target group associated with
      the load balancer
  ALBPublicDNS:
    Value: !GetAtt ALBFrontFacing.DNSName
    Description: Represents the Public DNS of the Elastic Load Balancing