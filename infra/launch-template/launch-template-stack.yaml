---
AWSTemplateFormatVersion: "2010-09-09"
Description: Stack to deploy Launch Template which contains launch configurations, init files etc.

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - prod
    ConstraintDescription: Choose either dev or prod
  ProjectName:
    Type: String
    Description: Represents the project name
  Owner:
    Type: String
    Description: Represents the owner of the project
  ManagedBy:
    Type: String
    Description: Represents the IAC used
  AMIID:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Description: Represents the AMI ID
  BootstrapVersion:
    Type: String
    Description: Git SHA or build version for forcing LT update
  LTStackName:
    Type: String
    Description: Represents the name of the Launch Template Stack
  ASGStackName:
    Type: String
    Description: Represents the name of the ASG Stack
  LaunchTemplateName: 
    Type: String
    Description: Represents the name of the Launch Template
Mappings:
  EnvironmentToInstanceType:
    dev:
      InstanceType: t3.micro
    prod:
      InstanceType: t3.small

Resources:
  AppLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Metadata:
      AWS::CloudFormation::Init:
        config:
          packages:
            yum:
              amazon-cloudwatch-agent: []
              unzip: []
              python3.13: []
          files:
            /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json:
              mode: "000644"
              owner: root
              group: root
              content:
                Fn::Sub: |
                  {
                    "agent": {
                      "metrics_collection_interval": 60,
                      "run_as_user": "root"
                    },
                    "logs": {
                      "logs_collected": {
                        "files": {
                          "collect_list": [
                            {
                              "file_path": "/var/log/cloud-init.log",
                              "log_group_name": "${Environment}/infrastructure/ec2/cloud-init",
                              "log_stream_name": "{instance_id}-cloud-init"
                            },
                            {
                              "file_path": "/var/log/cloud-init-output.log",
                              "log_group_name": "${Environment}/infrastructure/ec2/cloud-init",
                              "log_stream_name": "{instance_id}-cloud-init-output"
                            },
                            {
                              "file_path": "/var/log/app-*.log",
                              "log_group_name": "${Environment}/application/ec2/deploy",
                              "log_stream_name": "{instance_id}-app-deploy"
                            }
                          ]
                        }
                      }
                    }
                  }

            /etc/systemd/system/governance-api.service:
              mode: "000644"
              owner: root
              group: root
              content: 
                Fn::Sub: |
                  [Unit]
                  Description=AWS Infrastructure Governance API
                  After=network.target
  
                  [Service]
                  Type=simple
                  User=ec2-user
                  WorkingDirectory=/opt/app
                  Environment="ENVIRONMENT=${Environment}"
                  ExecStart=/opt/app/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000
                  Restart=on-failure
                  RestartSec=5
  
                  [Install]
                  WantedBy=multi-user.target

            /etc/systemd/system/governance-ui.service:
              mode: "000644"
              owner: root
              group: root
              content:
                Fn::Sub: |
                  [Unit]
                  Description=AWS Infrastructure Governance UI
                  After=network.target governance-api.service

                  [Service]
                  Type=simple
                  User=ec2-user
                  WorkingDirectory=/opt/app
                  Environment="ENVIRONMENT=${Environment}"
                  ExecStart=/opt/app/.venv/bin/streamlit run app/ui/app.py --server.address 0.0.0.0 --server.port 8501
                  Restart=on-failure
                  RestartSec=5

                  [Install]
                  WantedBy=multi-user.target

            /opt/app/deploy.sh:
              mode: "000755"
              owner: root
              group: root
              content:
                Fn::Sub:
                  - |
                    #!/bin/bash
                    set -euo pipefail

                    exec > >(tee -a /var/log/app-deploy.log)
                    exec 2>&1

                    ARTIFACT_BUCKET="${ARTIFACT_BUCKET}"

                    APP_DIR="/opt/app"
                    VENV_DIR="$APP_DIR/.venv"
                    VERSION_DIR="/tmp/app"
                    VERSION_FILE="$VERSION_DIR/current.txt"
                    ARTIFACT_FILE="$VERSION_DIR/app.zip"

                    echo "========== Application Deployment =========="

                    mkdir -p "$VERSION_DIR"
                    mkdir -p "$APP_DIR"

                    echo "Fetching current application version..."

                    # -------------------------------------------------------
                    # BOOTSTRAP SAFE CHECK
                    # -------------------------------------------------------

                    if ! aws s3 cp \
                      "s3://${ARTIFACT_BUCKET}/app/versions/current.txt" \
                      "$VERSION_FILE" >/dev/null 2>&1; then

                      echo "Bootstrap deployment detected."
                      echo "No current.txt found."
                      echo "Skipping application deployment."

                      exit 0
                    fi

                    # -------------------------------------------------------
                    # VERSION VALIDATION
                    # -------------------------------------------------------

                    VERSION=$(tr -d '[:space:]' < "$VERSION_FILE")

                    if [ -z "$VERSION" ]; then
                      echo "ERROR: current.txt is empty."
                      exit 1
                    fi

                    echo "Current Version: $VERSION"

                    # -------------------------------------------------------
                    # DOWNLOAD ARTIFACT
                    # -------------------------------------------------------

                    echo "Downloading application artifact..."

                    aws s3 cp \
                      "s3://${ARTIFACT_BUCKET}/app/releases/$VERSION.zip" \
                      "$ARTIFACT_FILE"

                    # -------------------------------------------------------
                    # DEPLOY APPLICATION
                    # -------------------------------------------------------

                    echo "Cleaning previous application files..."

                    rm -rf "$APP_DIR/app"

                    mkdir -p "$APP_DIR"

                    echo "Extracting application artifact..."

                    unzip -oq "$ARTIFACT_FILE" -d "$APP_DIR"

                    # -------------------------------------------------------
                    # APPLICATION VALIDATION
                    # -------------------------------------------------------

                    if [ ! -f "$APP_DIR/app/main.py" ]; then
                      echo "ERROR: app/main.py not found."
                      exit 1
                    fi

                    if [ ! -f "$APP_DIR/requirements.txt" ]; then
                      echo "ERROR: requirements.txt not found."
                      exit 1
                    fi

                    # -------------------------------------------------------
                    # PYTHON VIRTUAL ENVIRONMENT
                    # -------------------------------------------------------

                    echo "Creating Python virtual environment..."

                    if [ ! -d "$VENV_DIR" ]; then
                      python3.13 -m venv "$VENV_DIR"
                    fi

                    echo "Installing application dependencies..."

                    "$VENV_DIR/bin/pip" install \
                      --upgrade pip

                    "$VENV_DIR/bin/pip" install \
                      -r "$APP_DIR/requirements.txt"

                    # -------------------------------------------------------
                    # OWNERSHIP
                    # -------------------------------------------------------
                    
                    echo "Setting application ownership..."
                    
                    chown -R ec2-user:ec2-user "$APP_DIR"
                    
                    # -------------------------------------------------------
                    # SYSTEMD
                    # -------------------------------------------------------

                    echo "Reloading systemd..."

                    systemctl daemon-reload

                    echo "Enabling application services..."

                    systemctl enable governance-api.service
                    systemctl enable governance-ui.service

                    echo "Starting application services..."

                    systemctl restart governance-api.service
                    systemctl restart governance-ui.service
                    
                    echo "Application deployment completed successfully."

                  - ARTIFACT_BUCKET:
                      Fn::ImportValue: !Sub "${Environment}-app-artifact-bucket"

          commands:
            01_cloudwatch_agent_setup:
              command: |
                /bin/bash -c '
                sleep 10
                /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
                  -a fetch-config \
                  -m ec2 \
                  -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json \
                  -s
                '
            02_deploy_app:
              command: "/bin/bash /opt/app/deploy.sh"
          services:
            systemd:
              amazon-cloudwatch-agent:
                ensureRunning: "true"
                enabled: "true"
    Properties:
      LaunchTemplateData:
        IamInstanceProfile:
          Arn:
            Fn::ImportValue:
              Fn::Sub: "${Environment}-security-instance-profile-arn"
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 4
        ImageId: !Ref AMIID
        InstanceType: !FindInMap
          - EnvironmentToInstanceType
          - !Ref Environment
          - InstanceType
        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: "${Environment}-network-app-sg-id"
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              DeleteOnTermination: true
              VolumeSize: 8
              VolumeType: gp3
        UserData:
          Fn::Base64:
            Fn::Sub:
              - |
                #!/bin/bash -xe

                sleep 30

                echo "Bootstrap Version: ${BootstrapVersion}" > /etc/bootstrap-version

                /opt/aws/bin/cfn-init \
                  -v \
                  --stack ${LTStackName} \
                  --resource AppLaunchTemplate \
                  --role ${ROLE_NAME} \
                  --region ${AWS::Region}
  
                /opt/aws/bin/cfn-signal -e $? \
                  --stack ${ASGStackName} \
                  --resource AppAutoScalingGroup \
                  --region ${AWS::Region} \
                  --role ${ROLE_NAME}
              - ROLE_NAME:
                  Fn::ImportValue: !Sub "${Environment}-security-ec2-role"
      LaunchTemplateName: !Ref LaunchTemplateName
  AppLaunchTemplateParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/portfolio/${Environment}/lt-name"
      Type: String
      Value: !Ref AppLaunchTemplate
      Description: Launch template containing launch configurations for deploying the platform
      Tags:
        Environment: !Ref Environment
        Project: !Ref ProjectName
        ManagedBy: !Ref ManagedBy
        Owner: !Ref Owner
Outputs:
  AMI:
    Value: !Ref AMIID
    Description: Represents the AMI ID of the app instance
  LaunchTempID:
    Value: !GetAtt AppLaunchTemplate.LaunchTemplateId
    Description: Represents the ID of the launch template
    Export:
      Name: !Sub "${Environment}-launch-temp-id"
  LTSSM:
    Value: !Ref AppLaunchTemplateParameter
    Description: Represents the name of the SSM parameter for Launch Template
