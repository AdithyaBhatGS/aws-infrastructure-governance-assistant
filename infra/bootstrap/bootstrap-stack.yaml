---
AWSTemplateFormatVersion: "2010-09-09"
Description: Stack to construct the baseline. It includes OIDC, Permissions Boundary, Execution Roles, Deployment Roles

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - prod
    ConstraintDescription: Represents the environment for infra deployment
  ManagedBy:
    Type: String
    Description: Represents the entity that manages the infrastructure
    Default: CloudFormation
  ProjectName:
    Type: String
    Description: Represents the project name
    Default: static-web-hosting
  Owner:
    Type: String
    Description: Represents the owner of the project
    Default: devOps
  DeploymentBoundary:
    Type: String
    Description: Represents the permissions boundary policy name
  ValidationBoundary:
    Type: String
    Description: Represents the permissions boundary policy name
  InfraExecutionPolicyName:
    Type: String
    Description: Represents the name of the infra execution policy name
  AppExecutionPolicyName:
    Type: String
    Description: Represents the name of the app execution policy name
  InfraExecutionRoleName:
    Type: String
    Description: Represents the name of the infra execution role
  AppExecutionRoleName:
    Type: String
    Description: Represents the name of the app execution role
  InfraDeploymentPolicyName:
    Type: String
    Description: Represents the name of the infra deployment policy
  AppDeploymentPolicyName:
    Type: String
    Description: Represents the name of the app deployment policy
  InfraDeploymentRoleName:
    Type: String
    Description: Represents the name of the infra deployment role
  AppDeploymentRoleName:
    Type: String
    Description: Represents the name of the app deployment role
  BranchName:
    Type: String
    Description: Represents the branch name pattern
  RepoName:
    Type: String
    Description: Represents the owner, repository name of the github account
    Default: AdithyaBhatGS/multi-environment-cicd-pipeline-for-static-web-app
    NoEcho: true
  ValidationRoleName:
    Type: String
    Description: Represents the name of the validation role
    Default: template-validation-role
  ArtifactBucketName:
    Type: String
    Description: Represents the name of the artifact bucket name
Resources:
  GitHubOIDC:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: !Ref ManagedBy
        - Key: Owner
          Value: !Ref Owner
  DeploymentRoleBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Represents the permissions boundary for deployment roles
      ManagedPolicyName: !Ref DeploymentBoundary
      PolicyDocument:
        Version: "2012-10-17"
        Statement: 
          - Effect: Allow
            Action:
              - 's3:GetObject'
              - 's3:PutObject'
              - 's3:ListBucket'
            Resource: "*"
          
          - Effect: Allow
            Action:
              - 'cloudformation:*'
            Resource: "*"
          
          - Effect: Allow
            Action:
              - 'iam:PassRole'
            Resource: "*"

          - Effect: Deny
            Action:
              - 'iam:CreateUser'
              - 'iam:CreateAccessKey'
              - 'iam:AttachUserPolicy'
              - 'iam:AttachRolePolicy'
              - 'iam:PutRolePolicy'
              - 'iam:CreatePolicy'
              - 'iam:DeletePolicy'
              - 'iam:UpdateAssumeRolePolicy'
            Resource: "*"

          - Effect: Deny
            Action:
              - 'organizations:*'
            Resource: "*"
  ValidationRoleBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Represents the permissions boundary for validation role
      ManagedPolicyName: !Ref ValidationBoundary
      PolicyDocument: 
        Version: "2012-10-17"
        Statement: 
          - Effect: Allow
            Action:
              - 's3:GetObject'
              - 's3:ListBucket'
            Resource: "*"

          - Effect: Allow
            Action:
              - 'cloudformation:ValidateTemplate'
              - 'cloudformation:DescribeStacks'
              - 'cloudformation:DescribeStackEvents'
              - 'cloudformation:ListStacks'
              - 'cloudformation:GetTemplate'
            Resource: "*"

          - Effect: Deny
            Action:
              - 'iam:CreateUser'
              - 'iam:CreateAccessKey'
              - 'iam:AttachUserPolicy'
              - 'iam:AttachRolePolicy'
              - 'iam:PutRolePolicy'
              - 'iam:CreatePolicy'
              - 'iam:DeletePolicy'
              - 'iam:UpdateAssumeRolePolicy'
            Resource: "*"

          - Effect: Deny
            Action:
              - 'organizations:*'
            Resource: "*"
  InfraExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Represents the permissions for infra creation
      ManagedPolicyName: !Ref InfraExecutionPolicyName
      PolicyDocument: 
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - 'ec2:*'
            Resource: '*'
          
          - Effect: Allow
            Action:
              - 's3:*'
            Resource: '*'
          
          - Effect: Allow
            Action:
              - 'iam:CreateRole'
              - 'iam:CreateInstanceProfile'
              - 'iam:AddRoleToInstanceProfile'
              - 'iam:AttachRolePolicy'
              - 'iam:PassRole'
              - 'iam:GetRole'
              - 'iam:TagRole'
              - 'iam:GetRolePolicy'
              - 'iam:PutRolePolicy'
              - 'iam:GetInstanceProfile'
            Resource: '*'

          - Effect: Allow
            Action:
              - 'kms:CreateKey'
              - 'kms:DescribeKey'
              - 'kms:Encrypt'
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey'
              - 'kms:CreateAlias'
              - 'kms:PutKeyPolicy'
              - 'kms:TagResource'
              - 'kms:EnableKeyRotation'
            Resource: '*'

          - Effect: Allow
            Action:
              - logs:*
              - cloudwatch:*
            Resource: '*'

          - Effect: Allow
            Action:
              - tag:TagResources
              - tag:UntagResources
            Resource: '*'

  AppExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Represents the permission app execution
      ManagedPolicyName: !Ref AppExecutionPolicyName
      PolicyDocument: 
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - 'ec2:*'
            Resource: '*'

          - Effect: Allow
            Action:
              - 'autoscaling:*'
            Resource: '*'

          - Effect: Allow
            Action:
              - 'elasticloadbalancing:*'
            Resource: '*'

          - Effect: Allow
            Action:
              - 'logs:*'
              - 'cloudwatch:*'
            Resource: '*'

          - Effect: Allow
            Action:
              - 'kms:Decrypt'
              - 'kms:Encrypt'
              - 'kms:GenerateDataKey'
              - 'kms:DescribeKey'
            Resource: '*'
  InfraExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Represents the role for infra execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - cloudformation.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      ManagedPolicyArns:
        - !GetAtt InfraExecutionPolicy.PolicyArn
      RoleName: !Ref InfraExecutionRoleName
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: !Ref ManagedBy
        - Key: Owner
          Value: !Ref Owner
  AppExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: 
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - cloudformation.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      ManagedPolicyArns:
        - !GetAtt AppExecutionPolicy.PolicyArn
      RoleName: !Ref AppExecutionRoleName
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: !Ref ManagedBy
        - Key: Owner
          Value: !Ref Owner
  InfraDeploymentPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Represents the permissions for infra deployment
      ManagedPolicyName: !Ref InfraDeploymentPolicyName
      PolicyDocument: 
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:DeleteStack
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResources
              - cloudformation:ValidateTemplate
              - cloudformation:GetTemplate
              - cloudformation:ListStacks
              - cloudformation:CreateChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:GetTemplateSummary
            Resource: '*'

          - Effect: Allow
            Action:
              - iam:PassRole
            Resource:
              - !Sub "arn:aws:iam::${AWS::AccountId}:role/${Environment}-infra-execution-role"
  AppDeploymentPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties: 
      Description: Represents the permissions for app deployment
      ManagedPolicyName: !Ref AppDeploymentPolicyName
      PolicyDocument: 
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:DeleteStack
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResources
              - cloudformation:ValidateTemplate
              - cloudformation:GetTemplate
              - cloudformation:ListStacks
              - cloudformation:CreateChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:GetTemplateSummary
            Resource: "*"

          - Effect: Allow
            Action:
              - s3:ListBucket
            Resource:
              - !Sub "arn:aws:s3:::${ArtifactBucketName}"

          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource:
              - !Sub "arn:aws:s3:::${ArtifactBucketName}/*"

          - Effect: Allow
            Action:
              - iam:PassRole
            Resource:
              - !Sub "arn:aws:iam::${AWS::AccountId}:role/${Environment}-app-execution-role"
  InfraDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref InfraDeploymentRoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub
                  - "repo:${Repo}:ref:refs/heads/${Branch}"
                  - Repo: !Ref RepoName
                    Branch: !Ref BranchName
      ManagedPolicyArns:
        - !GetAtt InfraDeploymentPolicy.PolicyArn
      PermissionsBoundary: !Ref DeploymentRoleBoundary
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: !Ref ManagedBy
        - Key: Owner
          Value: !Ref Owner
  AppDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref AppDeploymentRoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub
                  - "repo:${Repo}:ref:refs/heads/${Branch}"
                  - Repo: !Ref RepoName
                    Branch: !Ref BranchName
      ManagedPolicyArns:
        - !GetAtt AppDeploymentPolicy.PolicyArn
      PermissionsBoundary: !Ref DeploymentRoleBoundary
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: !Ref ManagedBy
        - Key: Owner
          Value: !Ref Owner
  ValidationPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Represents the permissions for validation pipeline
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - cloudformation:ValidateTemplate
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:ListStacks
              - cloudformation:GetTemplate
            Resource: "*"

          - Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetObject
            Resource: "*"
  ValidationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref ValidationRoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub
                  - "repo:${Repo}:pull_request"
                  - Repo: !Ref RepoName
      ManagedPolicyArns:
        - !GetAtt ValidationPolicy.PolicyArn
      PermissionsBoundary: !Ref ValidationRoleBoundary
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: !Ref ManagedBy
        - Key: Owner
          Value: !Ref Owner
Outputs:
  DeploymentBoundaryARN:
    Value: !GetAtt DeploymentRoleBoundary.PolicyArn
    Description: Represents the ARN of the Permissions Boundary for deployment role
    Export: 
      Name: !Sub "${Environment}-bootstrap-deployment-boundary-arn"
  ValidationBoundaryARN:
    Value: !GetAtt ValidationRoleBoundary.PolicyArn
    Description: Represents the ARN of the Permissions Boundary for validation role
    Export: 
      Name: !Sub "${Environment}-bootstrap-validation-boundary-arn"
  InfraExecutionRoleARN:
    Value: !GetAtt InfraExecutionRole.Arn
    Description: Represents the ARN of the Infra Execution Role
    Export: 
      Name: !Sub "${Environment}-bootstrap-infra-execution-role-arn"
  AppExecutionRoleARN:
    Value: !GetAtt AppExecutionRole.Arn
    Description: Represents the ARN of the App Execution Role
    Export: 
      Name: !Sub "${Environment}-bootstrap-app-execution-role-arn"
  InfraDeployRoleARN:
    Value: !GetAtt InfraDeploymentRole.Arn
    Description: Represents the ARN of the Infra Deploy Role
    Export: 
      Name: !Sub "${Environment}-bootstrap-infra-deploy-role-arn"
  AppDeployRoleARN:
    Value: !GetAtt AppDeploymentRole.Arn
    Description: Represents the ARN of the App Deploy Role
    Export: 
      Name: !Sub "${Environment}-bootstrap-app-deploy-role-arn"
  ValidationRoleARN:
    Value: !GetAtt ValidationRole.Arn
    Description: Represents the ARN of the Validation Role
    Export: 
      Name: !Sub "bootstrap-validation-role-arn"
  OIDCARN:
    Value: !GetAtt GitHubOIDC.Arn
    Description: Represents the ARN of the OIDC
    Export: 
      Name: !Sub "${Environment}-bootstrap-oidc-arn"